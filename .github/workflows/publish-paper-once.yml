name: Publish paper with public links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-paper-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          python3 -m venv "$RUNNER_TEMP/pdfenv"
          "$RUNNER_TEMP/pdfenv/bin/pip" install pymupdf==1.26.7
      - name: Typeset the availability paragraph
        env:
          SOURCE_DATE_EPOCH: '1789732800'
        run: |
          mkdir -p "$RUNNER_TEMP/outer-pdf"
          cat > "$RUNNER_TEMP/outer-pdf/availability.tex" <<'TEX'
          \documentclass[11pt]{amsart}
          \usepackage[a4paper,margin=1.05in]{geometry}
          \usepackage[T1]{fontenc}
          \usepackage{lmodern,microtype}
          \usepackage[hidelinks]{hyperref}
          \setlength{\emergencystretch}{4em}
          \pagestyle{empty}
          \begin{document}
          \thispagestyle{empty}
          \raggedright
          \setlength{\parindent}{12pt}
          The paper is available in the public repository \href{https://github.com/yspennstate/outer-vertex-isoperimetry}{\mbox{\texttt{outer-vertex-isoperimetry}}}. The exact-arithmetic checker and Lean~4 development are in the \href{https://github.com/yspennstate/probability-proof-components/tree/main/verification/outer-vertex-isoperimetry}{\mbox{\texttt{verification/outer-vertex-isoperimetry}}} directory of \href{https://github.com/yspennstate/probability-proof-components}{\mbox{\texttt{probability-proof-components}}}; both repositories are maintained by \texttt{yspennstate}. The Lean development uses core Lean~4 without external libraries and covers finite boundary updates, bootstrap descent, terminal transfer, and threshold and quadrangular algebra. Its theorems use only \texttt{propext}, \texttt{Classical.choice} and \texttt{Quot.sound}. The infinite-graph theorems are proved in the text; computation does not replace these proofs.
          \end{document}
          TEX
          cd "$RUNNER_TEMP/outer-pdf"
          pdflatex -interaction=nonstopmode -halt-on-error availability.tex
      - name: Replace only the code-availability paragraph
        run: |
          "$RUNNER_TEMP/pdfenv/bin/python" - paper/main.pdf "$RUNNER_TEMP/outer-pdf/availability.pdf" Shmalo_Outer_Vertex_Isoperimetry.pdf <<'PY'
          from pathlib import Path
          import hashlib, sys
          import fitz
          original, overlay, output = map(Path, sys.argv[1:])
          data = original.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob == '15f094ecc9fcb54b49629555bb82b88ef77672ac', 'Unexpected source PDF'
          doc = fitz.open(original)
          assert len(doc) == 9
          page = doc[-1]
          old = [b for b in page.get_text('blocks') if b[4].startswith('The accompanying source package contains')]
          assert len(old) == 1
          old_rect = fitz.Rect(old[0][:4])
          replacement = fitz.open(overlay)
          assert len(replacement) == 1
          blocks = replacement[0].get_text('blocks')
          assert len(blocks) == 1
          new_rect = fitz.Rect(blocks[0][:4])
          assert new_rect.x0 >= 74 and new_rect.x1 <= 522
          assert new_rect.height <= old_rect.height
          clip = fitz.Rect(73, new_rect.y0 - 1, 523, new_rect.y1 + 1)
          target = fitz.Rect(73, old_rect.y0 - 1, 523, old_rect.y0 - 1 + clip.height)
          page.add_redact_annot(fitz.Rect(73, old_rect.y0 - 1, 523, old_rect.y1 + 1), fill=(1, 1, 1))
          page.apply_redactions(images=0, graphics=0)
          page.show_pdf_page(target, replacement, 0, clip=clip, keep_proportion=False)
          shift = target.y0 - clip.y0
          for link in replacement[0].get_links():
              assert link['kind'] == fitz.LINK_URI
              r = fitz.Rect(link['from'])
              r.y0 += shift
              r.y1 += shift
              page.insert_link({'kind':fitz.LINK_URI, 'from':r, 'uri':link['uri']})
          doc.save(output, garbage=4, deflate=True, no_new_id=True)
          doc.close()
          check, source = fitz.open(output), fitz.open(original)
          assert len(check) == len(source) == 9
          for i in range(8):
              a = source[i].get_pixmap(matrix=fitz.Matrix(1,1))
              b = check[i].get_pixmap(matrix=fitz.Matrix(1,1))
              assert a.samples == b.samples, ('Changed unedited page', i+1)
          assert 'The accompanying source package contains' not in check[-1].get_text()
          uris = {l.get('uri') for l in check[-1].get_links()}
          assert {
              'https://github.com/yspennstate/outer-vertex-isoperimetry',
              'https://github.com/yspennstate/probability-proof-components',
              'https://github.com/yspennstate/probability-proof-components/tree/main/verification/outer-vertex-isoperimetry',
          } <= uris
          result = output.read_bytes()
          print('PDF_SHA256',hashlib.sha256(result).hexdigest())
          print('PDF_GIT_BLOB',hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest())
          print('Verified: nine pages; pages 1-8 unchanged; three correct public links.')
          PY
      - name: Upload the paper to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force Shmalo_Outer_Vertex_Isoperimetry.pdf
          git commit -m 'Publish paper with correct public repository links'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: outer-vertex-paper
          path: Shmalo_Outer_Vertex_Isoperimetry.pdf
          if-no-files-found: error
          retention-days: 7
